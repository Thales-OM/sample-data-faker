worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ─────────────────────────────────────────────────────────────
    # Logging Format (includes upstream info for debugging)
    # ─────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'upstream: $upstream_addr upstream_status: $upstream_status '
                    'request_time: $request_time upstream_time: $upstream_response_time';

    access_log /var/log/nginx/access.log main;

    # ─────────────────────────────────────────────────────────────
    # Performance Tuning
    # ─────────────────────────────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_body_buffer_size 16k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # ─────────────────────────────────────────────────────────────
    # Upstream Configuration (Worker Pool)
    # ─────────────────────────────────────────────────────────────
    upstream synthetic_workers {
        # Use least_conn for better distribution of long-running tasks
        # This sends new requests to the worker with fewest active connections
        least_conn;

        # Single service name - docker-compose DNS resolves to all worker containers
        # Nginx will automatically discover all containers with service name "worker"
        server worker:8000 max_fails=2 fail_timeout=30s;

        # Keep persistent connections to workers (reduces connection overhead)
        keepalive 32;
    }

    # ─────────────────────────────────────────────────────────────
    # Main Server Block
    # ─────────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name localhost;

        # ─────────────────────────────────────────────────────────
        # File Upload Limits (for Avro OCF files)
        # ─────────────────────────────────────────────────────────
        client_max_body_size 20M;

        # ─────────────────────────────────────────────────────────
        # Timeouts for Long-Running SDV Tasks
        # ─────────────────────────────────────────────────────────
        # Connection to worker must be established quickly
        proxy_connect_timeout 5s;
        
        # Allow long-running generation tasks (SDV training + sampling)
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # ─────────────────────────────────────────────────────────
        # Proxy Headers (preserve client info)
        # ─────────────────────────────────────────────────────────
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Close connection after each request (work with keepalive above)
        proxy_set_header Connection "";

        # ─────────────────────────────────────────────────────────
        # Buffering Settings
        # ─────────────────────────────────────────────────────────
        # Disable buffering for streaming responses (large CSV uploads to S3)
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;

        # ─────────────────────────────────────────────────────────
        # Health Check Endpoint (for external monitoring & K8s readiness)
        # ─────────────────────────────────────────────────────────
        location /readiness {
            proxy_pass http://synthetic_workers;
            
            # Shorter timeouts for health checks
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }

        # ─────────────────────────────────────────────────────────
        # Liveness Check Endpoint (process alive, regardless of capacity)
        # ─────────────────────────────────────────────────────────
        location /liveness {
            proxy_pass http://synthetic_workers;
            
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }

        # ─────────────────────────────────────────────────────────
        # API Routes (all synthetic data generation endpoints)
        # ─────────────────────────────────────────────────────────
        location /api/ {
            proxy_pass http://synthetic_workers;
        }

        # ─────────────────────────────────────────────────────────
        # Metrics Endpoint (Prometheus, if exposed by app)
        # ─────────────────────────────────────────────────────────
        location /metrics {
            proxy_pass http://synthetic_workers;
            
            # Restrict access to internal networks
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            allow 127.0.0.1;
            deny all;
        }

        # ─────────────────────────────────────────────────────────
        # Nginx Status Page (for debugging load balancer itself)
        # ─────────────────────────────────────────────────────────
        location /nginx-status {
            stub_status on;
            
            # Restrict to internal networks only
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            allow 127.0.0.1;
            deny all;
        }

        # ─────────────────────────────────────────────────────────
        # Default: Return 404 for undefined routes
        # ─────────────────────────────────────────────────────────
        location / {
            return 404;
        }

        # ─────────────────────────────────────────────────────────
        # Error Pages (custom responses for common errors)
        # ─────────────────────────────────────────────────────────
        error_page 502 503 504 /50x.html;
        location = /50x.html {
            internal;
            default_type application/json;
            return 503 '{"error": "service_unavailable", "message": "All workers busy, please retry", "retry_after_seconds": 5}';
        }

        error_page 413 /413.html;
        location = /413.html {
            internal;
            default_type application/json;
            return 413 '{"error": "payload_too_large", "message": "File exceeds maximum upload size (100MB)"}';
        }
    }
}