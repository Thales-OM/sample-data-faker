services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./provisioning/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - worker

  worker:
    build: 
      dockerfile: ./Dockerfile
      context: ..
    volumes:
      - .env:/etc/env/.env:ro
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/liveness"]
      interval: 5s
      timeout: 3s
      retries: 2

  trino:
    image: trinodb/trino:436
    ports:
      - "8080:8080"
    volumes:
      - ./provisioning/trino/etc:/etc/trino:ro
    environment:
      - TZ=UTC
    depends_on:
      - hive-metastore
      - minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/info"]
      interval: 10s
      timeout: 5s
      retries: 5

  hive-metastore:
    image: 'prestodb/hive3.1-hive:5'
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    ports:
      - "9083:9083"
    volumes:
      - './provisioning/hive/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml'

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000" # API port
      - "9001:9001" # Console port
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_SERVER_URL: "http://localhost:9000"
      MINIO_BROWSER_REDIRECT_URL: "http://localhost:9001"
    volumes:
      - minio_data:/data
      - minio_config:/root/.minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  minio_data:
  minio_config:
