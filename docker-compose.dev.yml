services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - worker

  worker:
    build: 
      dockerfile: ./Dockerfile
      context: ..
    environment:
      - MAX_WORKERS=2
      - MAX_PENDING=3
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-minioadmin}
    volumes:
      - .env:/etc/env/.env:ro
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/liveness"]
      interval: 5s
      timeout: 3s
      retries: 2
  
  hive-metastore-db:
    image: postgres:15-alpine
    container_name: hive-metastore-db
    environment:
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive_password_change_me
      POSTGRES_DB: metastore
    volumes:
      - hive-metastore-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore"]
      interval: 5s
      timeout: 5s
      retries: 5

  hive-metastore:
    image: apache/hive:4.0.0
    container_name: hive-metastore
    environment:
      # Database connection
      - DB_DRIVER=org.postgresql.Driver
      - DB_URL=jdbc:postgresql://hive-metastore-db:5432/metastore
      - DB_USER=hive
      - DB_PASSWORD=hive_password_change_me
      # S3/MinIO configuration for Iceberg tables
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=${AWS_ACCESS_KEY_ID:-minioadmin}
      - S3_SECRET_KEY=${AWS_SECRET_ACCESS_KEY:-minioadmin}
      - S3_PATH_STYLE_ACCESS=true
      - AWS_REGION=us-east-1
      # Optional: enable debug logging
      - HMS_LOG_LEVEL=INFO
    ports:
      - "9083:9083"  # Thrift RPC port for HMS
    depends_on:
      hive-metastore-db:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9083"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000" # API port
      - "9001:9001" # Console port
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_SERVER_URL: "http://localhost:9000"
      MINIO_BROWSER_REDIRECT_URL: "http://localhost:9001"
    volumes:
      - minio_data:/data
      - minio_config:/root/.minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  minio_data:
  minio_config:
  hive-metastore-db-data:
