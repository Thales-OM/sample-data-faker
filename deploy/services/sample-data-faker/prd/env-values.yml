# This config applies to service when it's deployed to any cluster in PROD env
# Will be merged with deploy/services/py-app/py-app-values.yml and then with deploy/all/base-values.yml

replicaCount: 2

resources:
  requests:
    memory: "4096Mi"
    cpu: "2"
  limits:
    memory: "4096Mi"
    cpu: "2"

ingress:
  enabled: true
  ingressClassName: dg-tools
  objects:
    - servicePort: 80
      annotations:
        nginx.ingress.kubernetes.io/rewrite-target: /$2
        nginx.ingress.kubernetes.io/proxy-body-size: "50M"
        nginx.ingress.kubernetes.io/proxy-request-buffering: "on"
        # Recommended for large uploads:
        nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
        nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
        nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
      hosts:
        - name: "{{ .Helm.Release.Namespace }}-ingress-controller.{{ .Helm.Release.Namespace }}.{{ .Helm.Release.Cluster }}"
          path: /{{ .Helm.Release.Name }}(/|$)(.*)

vault:
  entrypoint: "python3 /app/main.py"
  enabled: true
  files:
    - vault_secret_path: services/dg-tools/prd/sample-data-faker
      vault_secret_key: dotenv
      mount_dir: /etc/env
      mount_file: .env
